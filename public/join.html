<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Joining Meeting...</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			background: linear-gradient(135deg, #0a66c2 0%, #084398 100%);
		}
		.loading-container {
			text-align: center;
			color: white;
		}
		.spinner {
			border: 4px solid rgba(255, 255, 255, 0.3);
			border-top: 4px solid white;
			border-radius: 50%;
			width: 50px;
			height: 50px;
			animation: spin 1s linear infinite;
			margin: 0 auto 20px;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		h1 {
			margin: 0 0 10px 0;
			font-size: 24px;
		}
		p {
			margin: 0;
			font-size: 16px;
			opacity: 0.9;
		}
		.error {
			background: #f8d7da;
			color: #721c24;
			padding: 20px;
			border-radius: 8px;
			margin: 20px auto;
			max-width: 500px;
			text-align: left;
		}
		.error h2 {
			margin-top: 0;
		}
	</style>
</head>
<body>
	<div class="loading-container" id="loadingContainer">
		<div class="spinner"></div>
		<h1>Joining Meeting...</h1>
		<p>Please wait while we connect you.</p>
	</div>

	<div id="errorContainer"></div>

	<script>
		async function autoJoin() {
			try {
				// Get roomId and token from URL parameters
				const params = new URLSearchParams(window.location.search)
				const roomId = params.get('roomId')
				const token = params.get('token')

				if (!roomId) {
					throw new Error('Missing roomId parameter')
				}

				if (!token) {
					throw new Error('Missing token parameter')
				}

				// Get display name from URL or use default
				const displayName = params.get('displayName') || 'Student ' + Math.floor(Math.random() * 1000)

				// Call REST API to join room
				const joinResponse = await fetch(
					`http://localhost:3000/api/webrtc/rooms/${roomId}/join`,
					{
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'Authorization': `Bearer ${token}`,
						},
						body: JSON.stringify({ displayName }),
					},
				)

				if (!joinResponse.ok) {
					throw new Error(`Failed to join: ${joinResponse.statusText}`)
				}

				const joinData = await joinResponse.json()
				console.log('Joined successfully:', joinData)

				// Redirect to meeting page with all data pre-filled
				const meetingUrl = new URL('/public/meeting.html', window.location.origin)
				meetingUrl.searchParams.set('roomId', roomId)
				meetingUrl.searchParams.set('accessToken', token)
				meetingUrl.searchParams.set('displayName', displayName)
				meetingUrl.searchParams.set('participantId', joinData.participantId)

				window.location.href = meetingUrl.toString()
			} catch (error) {
				console.error('Auto-join failed:', error)
				showError(error.message)
			}
		}

		function showError(message) {
			const container = document.getElementById('loadingContainer')
			const errorContainer = document.getElementById('errorContainer')

			container.style.display = 'none'

			errorContainer.innerHTML = `
				<div class="error">
					<h2>Connection Failed</h2>
					<p>${message}</p>
					<p style="margin-top: 15px; font-size: 14px;">
						<a href="javascript:location.reload()" style="color: #721c24; text-decoration: underline;">
							Try Again
						</a>
					</p>
				</div>
			`
		}

		// Start auto-join
		autoJoin()
	</script>
</body>
</html>
